<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Запись на смены</title>
<style>
body{font-family:Arial,sans-serif;max-width:850px;margin:40px auto;padding:0 20px;background:#f6f7f9}
.card{background:#fff;padding:24px;border-radius:14px;margin-bottom:18px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
input,button{font-size:16px;padding:11px 13px;border-radius:8px;border:1px solid #ccc}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.shift{border:1px solid #ddd;padding:16px;border-radius:10px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;gap:15px}
.muted{color:#666}
.err{color:#b00020}
#app{display:none}
</style>
</head>

<body>

<div class="card" id="login">
<h1>Запись на дополнительные смены</h1>
<p class="muted">Введите персональный код.</p>

<input id="code" placeholder="Например: 1001">
<button onclick="login()">Войти</button>

<p id="loginMsg"></p>
</div>

<div id="app">

<div class="card">
<h1>Доступные смены</h1>

<div>
Сотрудник: <strong id="employeeName"></strong>
</div>

<button onclick="loadShifts()">Обновить</button>

<div id="shifts"></div>
</div>

<div class="card">
<h2>Мои записи</h2>
<div id="myBookings"></div>
</div>

</div>

<script>
let employee=null;

async function login(){
 const msg=document.getElementById("loginMsg");
 msg.textContent="";

 const r=await fetch("/api/login",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
     code:document.getElementById("code").value.trim()
   })
 });

 const d=await r.json();

 if(!d.ok){
   msg.className="err";
   msg.textContent=d.error;
   return;
 }

 employee=d.employee;

 document.getElementById("login").style.display="none";
 document.getElementById("app").style.display="block";
 document.getElementById("employeeName").textContent=employee.name;

 loadShifts();
 loadMyBookings();
}

async function loadShifts(){

 const d=await (await fetch("/api/shifts")).json();
 const box=document.getElementById("shifts");

 box.innerHTML="";

 d.shifts.forEach(s=>{

   const x=document.createElement("div");
   x.className="shift";

   x.innerHTML=
     "<div><strong>"+s.date+"</strong><br>"+
     s.start+"–"+s.end+
     "<br><span class='muted'>Свободно: "+
     s.remaining+" из "+s.capacity+
     "</span></div>";

   const b=document.createElement("button");

   b.textContent=s.available?"Записаться":"Мест нет";
   b.disabled=!s.available;

   b.onclick=()=>book(s.id);

   x.appendChild(b);
   box.appendChild(x);
 });
}

async function book(shiftId){

 const d=await (await fetch("/api/book",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
     employeeId:employee.id,
     shiftId
   })
 })).json();

 alert(d.error||d.message);

 loadShifts();
 loadMyBookings();
}

async function loadMyBookings(){

 const d=await (await fetch(
   "/api/my-bookings?employeeId="+employee.id
 )).json();

 const box=document.getElementById("myBookings");

 box.innerHTML=d.bookings.length
   ?d.bookings.map(b=>
     "<div>"+b.shift.date+
     " — "+b.shift.start+
     "–"+b.shift.end+
     "</div>"
   ).join("")
   :"<span class='muted'>Записей пока нет.</span>";
}

</script>

</body>
</html>
